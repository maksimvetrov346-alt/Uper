<meta charset="utf-8">

<title>Uper</title>
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
:root {
  --bg: #f3f4f6; --card: #ffffff; --text: #14161a; --muted: #5b6370; --line: #dfe3ea;
  --accent: #4f9a00; --on-accent: #ffffff; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d10; --card: #16181d; --text: #f1f3f6; --muted: #9aa3b2; --line: #272b33;
    --accent: #b8f23a; --on-accent: #0c0d10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d10; --card: #16181d; --text: #f1f3f6; --muted: #9aa3b2; --line: #272b33;
  --accent: #b8f23a; --on-accent: #0c0d10; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 32px; }
header { text-align: center; margin-bottom: 20px; }
header img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
h1 { margin: 10px 0 2px; font-size: 26px; }
.tag { margin: 0; color: var(--muted); }
h2 { font-size: 18px; margin: 28px 0 10px; }
.btn { display: block; width: 100%; padding: 13px 16px; margin-bottom: 10px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
.btn.alt { background: transparent; color: var(--text); border: 1px solid var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.top img { width: 56px; height: 56px; border-radius: 12px; image-rendering: pixelated; flex: none; }
.top h3 { margin: 0; font-size: 18px; }
.row { margin: 4px 0; }
.row b { color: var(--muted); font-weight: 600; }
details { margin-top: 10px; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
pre { margin: 0 0 10px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
  overflow-x: auto; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
</style>
</head>

    <p class="tag" id="tagline"></p>
  </header>
  <div id="links"></div>
  <h2>Проекты</h2>
  <div id="projects"></div>
</main>

      info: [
        ["Версия", "1.1.0"],
        ["Обновление", "20-25 ноября"],
        ["Описание", "расставляйте фигуры, проводите игрока и собирайте награду."]
      ],
      download: "https://www.rustore.ru/catalog/app/com.rather.game1"
    },
    {
      title: "Ups",
      icon: "ups",
      info: [
        ["Версия", "на стадии разработки"],

        "pnt() — вывести текст в консоль",

      ]
    }
  ]
};

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  (children || []).forEach(function (c) { node.append(c); });
  return node;
}

document.getElementById("avatar").src = ICONS.cat;
document.getElementById("name").textContent = CONFIG.name;
document.getElementById("tagline").textContent = CONFIG.tagline;

const links = document.getElementById("links");
CONFIG.links.forEach(function (l) {
  links.append(el("a", { className: "btn", href: l.url, target: "_blank", rel: "noopener", textContent: l.title }));
});

const list = document.getElementById("projects");
CONFIG.projects.forEach(function (p) {
  const card = el("div", { className: "card" });
  card.append(el("div", { className: "top" }, [
    el("img", { src: ICONS[p.icon], alt: "" }),
    el("h3", { textContent: p.title })
  ]));
  p.info.forEach(function (pair) {
    card.append(el("div", { className: "row" }, [el("b", { textContent: pair[0] + ": " }), pair[1]]));
  });
  if (p.download) {
    const dl = el("a", { className: "btn", href: p.download, target: "_blank", rel: "noopener", textContent: "Скачать" });
    dl.style.marginTop = "12px";
    dl.style.marginBottom = "0";
    card.append(dl);
  }
  if (p.syntax) {
    card.append(el("details", {}, [
      el("summary", { className: "btn alt", textContent: "Синтаксис" }),
      el("pre", { textContent: p.syntax.join("\n") })
    ]));
  }
  list.append(card);
});
</script>
</body>
